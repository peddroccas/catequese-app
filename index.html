<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%APP_NAME%</title>
    <meta name="description" content="Inscrições, turmas e catequizandos em um só lugar." />

    <!-- Ícones: o SVG troca de cor no modo escuro do navegador; o PNG é o reserva -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F5F1EB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141921" media="(prefers-color-scheme: dark)" />

    <!-- Prévia de link (WhatsApp, redes). %SITE_URL% vem de VITE_SITE_URL no build -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%APP_NAME%" />
    <meta property="og:description" content="Inscrições, turmas e catequizandos em um só lugar." />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Catequese Hub" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
